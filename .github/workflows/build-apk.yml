name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode secrets (optional)
        if: ${{ secrets.PODCASTINDEX_KEY != '' }}
        run: |
          mkdir -p ~/.gradle
          echo "PODCASTINDEX_KEY=${{ secrets.PODCASTINDEX_KEY }}" >> local.properties
          echo "PODCASTINDEX_SECRET=${{ secrets.PODCASTINDEX_SECRET }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned, if signing not configured)
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Fail if no APK produced (guards against HTML drift)
        run: |
          if ! ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "::error::No APK produced. Check that this is a native Android project, not an HTML/web demo."
            exit 1
          fi
